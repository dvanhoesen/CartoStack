name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.23"

jobs:
  lint:
    name: Format, lint, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy

  core:
    # The runtime must work with only NumPy and Pillow installed.
    name: Core only (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: Extras are not installed
        run: >
          uv run python -c "import importlib.util as u, sys;
          bad = [m for m in ('matplotlib', 'cartopy', 'pyproj', 'shapely') if u.find_spec(m)];
          sys.exit(f'unexpected: {bad}' if bad else 0)"
      - run: uv run pytest

  core-lowest:
    name: Core only, lowest direct dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv venv --python 3.12
      - run: uv pip install --resolution lowest-direct . "pytest>=8.3"
      - run: uv pip list
      - run: .venv/bin/python -m pytest

  build-extra:
    name: Build extra (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --extra build --group dev
      - run: uv run pytest

  dist:
    name: Build and check distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - run: uv build --out-dir dist
      - name: Wheel installs alone and imports outside the source tree
        run: |
          uv venv --python 3.13 /tmp/wheelenv
          uv pip install --python /tmp/wheelenv/bin/python dist/*.whl
          cd /tmp && /tmp/wheelenv/bin/python -c "import sys, cartostack;
          assert 'site-packages' in cartostack.__file__, cartostack.__file__;
          bad = [m for m in sys.modules if m.split('.')[0] in ('matplotlib', 'cartopy')];
          assert not bad, bad; print(cartostack.__version__)"
      - name: Tests run from the sdist
        run: |
          mkdir /tmp/sdist && tar xzf dist/*.tar.gz -C /tmp/sdist
          cd /tmp/sdist/cartostack-* && uv run --isolated --with "pytest>=8.3" pytest
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
